name: Сборка прототипа (APK)

# Запуск вручную: GitHub → Actions → «Сборка прототипа (APK)» → Run workflow.
# Результат — релиз prototype-N с файлами lecture-notes.apk (Kotlin) и lecture-notes-rn.apk (React Native).
# Постоянная ссылка на последнюю сборку:
#   https://github.com/<владелец>/<репозиторий>/releases/latest/download/lecture-notes.apk

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Адрес сервера на Render, например https://lecture-notes-api.onrender.com"
        required: true
      build_rn:
        description: "Собрать и версию на React Native"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.url.outputs.api_url }}
    steps:
      - id: url
        env:
          RAW: ${{ inputs.api_url }}
        run: |
          url="${RAW%/}"
          case "$url" in
            https://*) ;;
            *) echo "::error::Адрес сервера должен начинаться с https://"; exit 1 ;;
          esac
          echo "api_url=$url" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Сборка (R8, только HTTPS, подпись debug-ключом)
        run: ./gradlew --no-daemon assembleDemo -PlectureApiUrl="${{ needs.prepare.outputs.api_url }}/"
      - run: cp app/build/outputs/apk/demo/app-demo.apk ../lecture-notes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-kotlin
          path: lecture-notes.apk
          retention-days: 30

  react-native:
    needs: prepare
    if: ${{ inputs.build_rn }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-rn
    env:
      APP_ENV: production
      API_URL: ${{ needs.prepare.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Генерация нативного проекта
        run: npx expo prebuild --platform android --no-install
      - name: Сборка release (шаблон Expo подписывает её debug-ключом)
        working-directory: mobile-rn/android
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: cp android/app/build/outputs/apk/release/app-release.apk ../lecture-notes-rn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-react-native
          path: lecture-notes-rn.apk
          retention-days: 30

  release:
    needs: [android, react-native]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          API_URL: ${{ inputs.api_url }}
        run: |
          ls -la *.apk
          gh release create "prototype-${{ github.run_number }}" *.apk \
            --title "Прототип №${{ github.run_number }}" \
            --notes "Сборка для показа. Сервер: ${API_URL}. Перед обновлением удалите предыдущую версию приложения (сборки подписаны разными debug-ключами)." \
            --latest
